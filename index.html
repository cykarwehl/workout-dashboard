<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8F7FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Workout Dashboard">
<title>My Workout Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F8F7FF;
    --surface: #FFFFFF;
    --surface2: #EEF1F8;
    --accent: #4A6FA5;
    --accent2: #7B9DD4;
    --accent-light: #DBE6F5;
    --text: #1E2D4A;
    --muted: #8A95A8;
    --border: rgba(74,111,165,0.12);
    --border2: rgba(74,111,165,0.2);
    --fresh: #4A6FA5;
    --aging: #C9923A;
    --plateau: #C97A6A;
    --success: #4A9B7F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; overflow-x: hidden; }

  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(248,247,255,0.92); backdrop-filter: blur(20px); padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
  .topbar h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; letter-spacing: 0.5px; color: var(--accent); }
  .topbar p { font-size: 13px; color: var(--muted); letter-spacing: 0.3px; margin-top: 1px; }

  main { padding: 16px 20px 100px; }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(74,111,165,0.06); }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
  .section-badge { font-size: 12px; color: var(--accent); background: var(--accent-light); padding: 4px 12px; border-radius: 20px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .kpi-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; font-weight: 600; }
  .kpi-val { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; line-height: 1; color: var(--accent); }
  .kpi-sub { font-size: 13px; color: var(--success); margin-top: 6px; font-weight: 500; }

  .chart-wrap { position: relative; height: 180px; }
  .chart-wrap-sm { position: relative; height: 140px; }

  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .styled-select { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 15px; padding: 11px 14px; appearance: none; -webkit-appearance: none; cursor: pointer; }

  .pill-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .pill { flex: 1; text-align: center; padding: 7px 0; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .pr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pr-table th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; padding: 0 10px 12px; text-align: center; }
  .pr-table th:first-child { text-align: left; padding-left: 0; }
  .pr-table td { padding: 10px 8px; text-align: center; border-top: 1px solid var(--border); vertical-align: top; }
  .pr-table td:first-child { text-align: left; padding-left: 0; font-weight: 600; font-size: 14px; color: var(--text); }
  .pr-weight { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--accent); line-height: 1.1; }
  .pr-date { font-size: 12px; margin-top: 3px; font-weight: 500; }
  .pr-empty { color: var(--muted); font-size: 16px; }
  .date-fresh { color: var(--fresh); }
  .date-aging { color: var(--aging); }
  .date-plateau { color: var(--plateau); }

  .pr-feed-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .pr-feed-item:first-child { border-top: none; }
  .pr-feed-machine { font-weight: 600; font-size: 14px; color: var(--text); }
  .pr-feed-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500; }
  .pr-feed-weight { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--accent); }

  .year-nav-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--accent); width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .year-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .streak-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px 6px; }
  .streak-week { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .streak-month-label { font-size: 9px; color: var(--muted); font-weight: 600; height: 11px; line-height: 11px; white-space: nowrap; }
  .streak-circle { width: 20px; height: 20px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); flex-shrink: 0; }
  .streak-circle.floor { background: var(--accent); border-color: var(--accent); }
  .streak-circle.goal { background: var(--success); border-color: var(--success); }
  .streak-circle.future { background: transparent; border: 1px dashed var(--border2); opacity: 0.5; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(248,247,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 10px 0 20px; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.2px; transition: color 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { width: 26px; height: 26px; object-fit: contain; }

  .page { display: none; }
  .page.active { display: block; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: var(--muted); gap: 14px; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .month-bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding-top: 20px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .month-bar { width: 100%; background: var(--accent-light); border-radius: 4px 4px 0 0; position: relative; min-height: 4px; transition: height 0.6s ease; }
  .month-bar.current { background: linear-gradient(180deg, var(--accent2), var(--accent)); }
  .month-bar-val { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 12px; color: var(--accent); font-weight: 700; }
  .month-label { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }

  .legend-row { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; font-weight: 500; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

  .log-label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
  .log-label:first-of-type { margin-top: 0; }
  .log-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 16px; padding: 11px 14px; }
  .log-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .set-row { display: grid; grid-template-columns: 44px 1fr 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-row-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .set-num { font-size: 13px; font-weight: 600; color: var(--muted); }
  .set-remove { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
  .btn { width: 100%; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; padding: 12px; cursor: pointer; }
  .btn-ghost { background: transparent; border: 1px dashed var(--border2); color: var(--accent); margin-top: 4px; }
  .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; margin-top: 16px; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .log-status { font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; text-align: center; }
  .log-status.ok { color: var(--success); }
  .log-status.err { color: var(--plateau); }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

</style>
</head>
<body>

<div class="topbar">
  <h1>Workout Dashboard</h1>
  <p id="last-sync">Loading...</p>
</div>

<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <span style="font-size:13px;">Fetching your workouts...</span>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="showPage('overview')">
    <img class="nav-icon" src="icons/Overview.svg" alt="">
    <span>Overview</span>
  </div>
  <div class="nav-item" onclick="showPage('streak')">
    <img class="nav-icon" src="icons/streak.svg" alt="">
    <span>Streak</span>
  </div>
  <div class="nav-item" onclick="showPage('progress')">
    <img class="nav-icon" src="icons/Progress.svg" alt="">
    <span>Progress</span>
  </div>
  <div class="nav-item" onclick="showPage('prs')">
    <img class="nav-icon" src="icons/PRs.svg" alt="">
    <span>PRs</span>
  </div>
  <div class="nav-item" onclick="showPage('log')">
    <img class="nav-icon" src="icons/Log.svg" alt="">
    <span>Log</span>
  </div>
</nav>

<script>
const SHEET_ID = '1l3J7Jedab0h9viwceYc8TQYp1yhylvOIkT_-Q_-L4pw';
const API_KEY = 'AIzaSyALt9PbCeLs6Iqw8tfrL6GddCG5pUAIWH4';
const RANGE = 'Sheet1!A:H';

let allData = [];
let currentPage = 'overview';
let weightChart = null;
let volumeChart = null;
let selectedRange = 6;

async function fetchData() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} — check your sheet is public and API key is valid`);
  const json = await res.json();
  return json.values || [];
}

// The gym renamed "Negative" to "Eccentric" — same training mode, so both spellings
// collapse to one label to keep the comparison history intact.
const MODE_ALIASES = [
  { canonical: 'Eccentric', matches: ['eccentric', 'negative', 'negativ', 'exzentrisch'] },
];

function normalizeMode(raw) {
  const mode = (raw || '').trim();
  if (!mode) return '';
  const lower = mode.toLowerCase();
  const alias = MODE_ALIASES.find(a => a.matches.some(m => lower.includes(m)));
  return alias ? alias.canonical : mode;
}

function parseRows(rows) {
  if (rows.length < 2) return [];
  return rows.slice(1).map(row => ({
    date: row[0] || '',
    machine: (row[1] || '').replace('EGYM ', ''),
    setNum: parseInt(row[2]) || 0,
    reps: parseInt(row[3]) || 0,
    weight: parseFloat(row[4]) || 0,
    mode: normalizeMode(row[5]),
    isPR: ['true','yes','1'].includes((row[6] || '').toLowerCase()),
    file: row[7] || ''
  })).filter(r => r.machine && r.date && (r.weight > 0 || r.reps > 0)); // weight 0 = bodyweight set
}

function parseDate(d) {
  const dt = new Date(d);
  return isNaN(dt) ? null : dt;
}

function formatDate(d) {
  const dt = parseDate(d);
  if (!dt) return d;
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDateShort(d) {
  const dt = parseDate(d);
  if (!dt) return d;
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function daysSince(d) {
  const dt = parseDate(d);
  if (!dt) return 999;
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}

function dateClass(d) {
  const days = daysSince(d);
  if (days < 14) return 'date-fresh';
  if (days < 28) return 'date-aging';
  return 'date-plateau';
}

function getUniqueDates(data) {
  return [...new Set(data.map(r => r.date))].sort();
}

// Heavier always wins; between bodyweight sets (0 kg), more reps wins.
function beatsPR(r, prev) {
  if (!prev) return true;
  if (r.weight !== prev.weight) return r.weight > prev.weight;
  return r.weight === 0 && r.reps > prev.reps;
}

function formatLoad(r) {
  return r.weight > 0 ? `${r.weight} kg` : `${r.reps} reps`;
}

function computePRs(data) {
  const bests = {};
  const sorted = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
  sorted.forEach(r => {
    const key = `${r.machine}|${r.mode}`;
    if (beatsPR(r, bests[key])) {
      bests[key] = { weight: r.weight, reps: r.reps, date: r.date, machine: r.machine, mode: r.mode };
    }
  });
  return bests;
}

function computePRAchievements(data) {
  const bests = {};
  const achievements = [];
  const sorted = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
  sorted.forEach(r => {
    const key = `${r.machine}|${r.mode}`;
    if (beatsPR(r, bests[key])) {
      bests[key] = r;
      achievements.push({ weight: r.weight, reps: r.reps, date: r.date, machine: r.machine, mode: r.mode });
    }
  });
  return achievements;
}

function filterByRange(data, months) {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  return data.filter(r => { const dt = parseDate(r.date); return dt && dt >= cutoff; });
}

function formatVolume(v) {
  return v >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v);
}

function getWeekKey(dt) {
  const d = new Date(dt);
  const dayIdx = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - dayIdx);
  d.setHours(0, 0, 0, 0);
  return d;
}

function computeWeekCounts(dates) {
  const weekCounts = {};
  dates.forEach(d => {
    const dt = parseDate(d);
    if (!dt) return;
    const key = getWeekKey(dt).getTime();
    weekCounts[key] = (weekCounts[key] || 0) + 1;
  });
  return weekCounts;
}

function computeStreak(dates) {
  if (!dates.length) return { streak: 0, thisWeekCount: 0 };
  const weekCounts = computeWeekCounts(dates);

  const cursor = getWeekKey(new Date());
  const thisWeekCount = weekCounts[cursor.getTime()] || 0;
  if (thisWeekCount < 2) cursor.setDate(cursor.getDate() - 7); // in-progress week doesn't break the streak

  let streak = 0;
  while ((weekCounts[cursor.getTime()] || 0) >= 2) {
    streak++;
    cursor.setDate(cursor.getDate() - 7);
  }
  return { streak, thisWeekCount };
}

function buildRecentPRs(data) {
  const list = computePRAchievements(data)
    .filter(r => daysSince(r.date) <= 7)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  const body = list.length ? list.map(r => `
      <div class="pr-feed-item">
        <div class="pr-feed-info">
          <div class="pr-feed-machine">${r.machine}</div>
          <div class="pr-feed-meta">${modeLabel(r.mode || '__other__')} · ${formatDateShort(r.date)}</div>
        </div>
        <div class="pr-feed-weight">${formatLoad(r)}</div>
      </div>`).join('')
    : `<div style="color:var(--muted);font-size:13px;padding:8px 0;">No PRs yet in the last 7 days.</div>`;

  return `
    <div class="section">
      <div class="section-header">
        <span class="section-title">Recent PRs</span>
        <span class="section-badge">last 7 days</span>
      </div>
      ${body}
    </div>`;
}

function weeksInYear(year) {
  let d = getWeekKey(new Date(year, 0, 1));
  while (d.getFullYear() < year) d.setDate(d.getDate() + 7);
  const weeks = [];
  while (d.getFullYear() === year) {
    weeks.push(new Date(d));
    d.setDate(d.getDate() + 7);
  }
  return weeks;
}

let selectedStreakYear = new Date().getFullYear();
let streakMinYear = selectedStreakYear;

function weekTier(count, isFuture) {
  if (isFuture) return 'future';
  if (count >= 3) return 'goal';
  if (count >= 2) return 'floor';
  return 'below';
}

function buildStreakYearGrid(data, year) {
  const weekCounts = computeWeekCounts(getUniqueDates(data));
  const weeks = weeksInYear(year);
  const todayWeekStart = getWeekKey(new Date()).getTime();

  return weeks.map((monday, i) => {
    const isFirstOfMonth = i === 0 || monday.getMonth() !== weeks[i - 1].getMonth();
    const label = isFirstOfMonth ? monday.toLocaleDateString('en-GB', { month: 'short' }) : '';
    const count = weekCounts[monday.getTime()] || 0;
    const tier = weekTier(count, monday.getTime() > todayWeekStart);
    const title = `${formatDateShort(monday.toISOString().slice(0, 10))}: ${count} session${count === 1 ? '' : 's'}`;
    return `<div class="streak-week"><div class="streak-month-label">${label}</div><div class="streak-circle ${tier}" title="${title}"></div></div>`;
  }).join('');
}

function updateStreakYear() {
  document.getElementById('streak-year-label').textContent = selectedStreakYear;
  document.getElementById('streak-grid').innerHTML = buildStreakYearGrid(allData, selectedStreakYear);
  document.getElementById('streak-prev').disabled = selectedStreakYear <= streakMinYear;
  document.getElementById('streak-next').disabled = selectedStreakYear >= new Date().getFullYear();
}

function changeStreakYear(delta) {
  selectedStreakYear += delta;
  updateStreakYear();
}

function buildStreak(data) {
  const dates = getUniqueDates(data);
  const { streak } = computeStreak(dates);
  const years = dates.map(d => parseDate(d)).filter(Boolean).map(d => d.getFullYear());
  streakMinYear = years.length ? Math.min(...years) : new Date().getFullYear();
  selectedStreakYear = new Date().getFullYear();

  return `
  <div class="page fade-in" id="page-streak">
    <div class="kpi-grid" style="grid-template-columns:1fr;">
      <div class="kpi">
        <div class="kpi-label">Current streak</div>
        <div class="kpi-val">${streak}</div>
        <div class="kpi-sub">week${streak === 1 ? '' : 's'} in a row, 2+ sessions</div>
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">Weekly activity</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="year-nav-btn" id="streak-prev" onclick="changeStreakYear(-1)">‹</button>
          <span class="section-badge" id="streak-year-label">${selectedStreakYear}</span>
          <button class="year-nav-btn" id="streak-next" onclick="changeStreakYear(1)">›</button>
        </div>
      </div>
      <div class="legend-row">
        <div class="legend-item"><span class="legend-dot" style="background:var(--surface2);border:1px solid var(--border2)"></span>&lt; 2 sessions</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>2 sessions</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--success)"></span>3+ sessions</div>
      </div>
      <div class="streak-grid" id="streak-grid">${buildStreakYearGrid(data, selectedStreakYear)}</div>
    </div>
  </div>`;
}

function buildOverview(data) {
  const dates = getUniqueDates(data);
  const lastDate = dates[dates.length - 1] || '';
  const daysSinceLast = dates.length ? daysSince(lastDate) : null;

  const monthMap = {};
  dates.forEach(d => {
    const dt = parseDate(d);
    if (!dt) return;
    const key = dt.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
    monthMap[key] = (monthMap[key] || 0) + 1;
  });
  const monthEntries = Object.entries(monthMap).slice(-12);
  const maxVisits = Math.max(...monthEntries.map(e => e[1]), 1);
  const nowKey = new Date().toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });

  const sortedData = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
  const volumeMap = {};
  sortedData.forEach(r => {
    const dt = parseDate(r.date);
    if (!dt) return;
    const key = dt.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
    volumeMap[key] = (volumeMap[key] || 0) + r.reps * r.weight;
  });
  const volumeEntries = Object.entries(volumeMap).slice(-12);
  const maxVolume = Math.max(...volumeEntries.map(e => e[1]), 1);

  return `
  <div class="page active fade-in" id="page-overview">
    <div class="kpi-grid" style="grid-template-columns:1fr;">
      <div class="kpi">
        <div class="kpi-label">Days since last session</div>
        <div class="kpi-val ${dateClass(lastDate)}">${daysSinceLast ?? '—'}</div>
        <div class="kpi-sub">last trained ${lastDate ? formatDate(lastDate) : '—'}</div>
      </div>
    </div>
    ${buildRecentPRs(data)}
    <div class="section">
      <div class="section-header">
        <span class="section-title">Gym visits per month</span>
        <span class="section-badge">last 12 months</span>
      </div>
      <div class="month-bars">
        ${monthEntries.map(([label, count]) => `
          <div class="month-col">
            <div class="month-bar ${label === nowKey ? 'current' : ''}" style="height:${Math.round(count/maxVisits*80)}px">
              <span class="month-bar-val">${count}</span>
            </div>
            <div class="month-label">${label.split(' ')[0]}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">Total volume lifted</span>
        <span class="section-badge">reps × kg per month</span>
      </div>
      <div class="month-bars">
        ${volumeEntries.map(([label, vol]) => `
          <div class="month-col">
            <div class="month-bar ${label === nowKey ? 'current' : ''}" style="height:${Math.round(vol/maxVolume*80)}px">
              <span class="month-bar-val">${formatVolume(vol)}</span>
            </div>
            <div class="month-label">${label.split(' ')[0]}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

const MACHINE_CATEGORIES = [
  { label: 'Upper Body', machines: ['Biceps Curl','Butterfly','Chest Press','Lat Pulldown','Reverse Butterfly','Seated Row','Shoulder Press','Triceps', 'Dumbbell Incline Press', 'Dumbbell Flys Incline', 'Dumbbell Lateral Raises', 'Cable Triceps Pressdown', 'Cable Face Pull', 'Dumbbell Rows 1 Arm'] },
  { label: 'Core',       machines: ['Abdominal Crunch','Back Extension'] },
  { label: 'Lower Body', machines: ['Leg Curl','Leg Extension','Leg Press', 'Barbell Hip Thrusts', 'Lunges Alternating', 'Cable Romanian Deadlift', 'Cable Hip Abduction', 'Kettleball Front Squat', 'Abductor', 'Romanian Deadlift', 'Single Leg Hip Thrust'] },
];

function buildMachineOptions(available) {
  const lower = m => m.toLowerCase();
  const groups = MACHINE_CATEGORIES.map(cat => {
    const opts = cat.machines
      .filter(m => available.some(a => lower(a) === lower(m)))
      .map(m => {
        const actual = available.find(a => lower(a) === lower(m)) || m;
        return `<option value="${actual}">${actual}</option>`;
      }).join('');
    return opts ? `<optgroup label="${cat.label}">${opts}</optgroup>` : '';
  }).join('');
  const known = MACHINE_CATEGORIES.flatMap(c => c.machines).map(lower);
  const other = available.filter(a => !known.includes(lower(a))).map(a => `<option value="${a}">${a}</option>`).join('');
  return groups + (other ? `<optgroup label="Other">${other}</optgroup>` : '');
}

function buildProgress(data) {
  const machines = [...new Set(data.map(r => r.machine))].sort();
  const modes = [...new Set(data.map(r => r.mode))].filter(Boolean).sort();
  const hasOther = data.some(r => !r.mode);
  return `
  <div class="page fade-in" id="page-progress">
    <div class="filter-row">
      <select class="styled-select" id="mode-select" onchange="updateCharts()">
        ${modes.map(m => `<option value="${m}"${m === 'Adaptive' ? ' selected' : ''}>${m}</option>`).join('')}
        ${hasOther ? `<option value="__other__">No mode</option>` : ''}
      </select>
      <select class="styled-select" id="machine-select" onchange="onMachineChange()">
        ${buildMachineOptions(machines)}
      </select>
    </div>
    <div class="pill-row">
      <button class="pill active" onclick="setRange(6,this)">6M</button>
      <button class="pill" onclick="setRange(12,this)">12M</button>
      <button class="pill" onclick="setRange(18,this)">18M</button>
      <button class="pill" onclick="setRange(24,this)">24M</button>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title" id="weight-title">Weight over time</span>
        <span class="section-badge" id="weight-pr-badge"></span>
      </div>
      <div class="legend-row" id="weight-legend"></div>
      <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">Volume over time</span>
        <span class="section-badge" id="volume-badge">reps × kg per session</span>
      </div>
      <div class="legend-row" id="volume-legend"></div>
      <div class="chart-wrap-sm"><canvas id="volumeChart"></canvas></div>
    </div>
  </div>`;
}

const MODE_COLORS = [
  { line: '#4A6FA5', bar: 'rgba(74,111,165,0.7)' },
  { line: '#7B9DD4', bar: 'rgba(123,157,212,0.7)' },
  { line: '#4A9B7F', bar: 'rgba(74,155,127,0.7)' },
  { line: '#C9923A', bar: 'rgba(201,146,58,0.7)' },
];

// Free-weight exercises have no mode, so jump to a mode the chosen machine actually has.
function onMachineChange() {
  const machine = document.getElementById('machine-select')?.value;
  const modeSelect = document.getElementById('mode-select');
  if (machine && modeSelect) {
    const rows = allData.filter(r => r.machine === machine);
    if (!rows.some(modeFilter(modeSelect.value)) && rows.length) {
      modeSelect.value = rows[rows.length - 1].mode || '__other__';
    }
  }
  updateCharts();
}

function setRange(months, btn) {
  selectedRange = months;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  updateCharts();
}

const modeFilter = mode => mode === '__other__' ? r => !r.mode : r => r.mode === mode;
const modeLabel = mode => mode === '__other__' ? 'No mode' : mode;

// Bodyweight-only exercises (every set 0 kg) are charted in reps instead of kg.
function chartUnit(rows) {
  return rows.length && rows.every(r => r.weight === 0) ? 'reps' : 'kg';
}

function buildWeightDatasets(modes, rangeData, allDates, unit) {
  const metric = unit === 'reps' ? r => r.reps : r => r.weight;
  return modes.map((mode, i) => {
    const color = MODE_COLORS[i % MODE_COLORS.length];
    const modeRows = rangeData.filter(modeFilter(mode)).sort((a,b) => new Date(a.date)-new Date(b.date));
    const maxW = modeRows.length ? Math.max(...modeRows.map(metric)) : 0;
    const data = allDates.map(d => {
      const rows = modeRows.filter(r => r.date === d);
      return rows.length ? Math.max(...rows.map(metric)) : null;
    });
    return { label: modeLabel(mode), data, borderColor: color.line, backgroundColor: color.line+'15', borderWidth: 2, fill: modes.length===1, tension: 0.3, spanGaps: true, pointBackgroundColor: data.map(w => w===maxW ? color.line : '#fff'), pointBorderColor: color.line, pointRadius: 4, pointHoverRadius: 6, _maxW: maxW };
  });
}

function buildVolumeDatasets(modes, rangeData, allDates, unit) {
  const setVolume = unit === 'reps' ? r => r.reps : r => r.reps * r.weight;
  return modes.map((mode, i) => {
    const color = MODE_COLORS[i % MODE_COLORS.length];
    const modeRows = rangeData.filter(modeFilter(mode));
    const data = allDates.map(d => {
      const rows = modeRows.filter(r => r.date === d);
      return rows.length ? rows.reduce((sum, r) => sum + setVolume(r), 0) : null;
    });
    return { label: modeLabel(mode), data, backgroundColor: color.bar, borderRadius: 4, borderSkipped: false };
  });
}

function updatePRBadge(modes, weightDatasets, machineData, unit) {
  const badge = document.getElementById('weight-pr-badge');
  if (!badge) return;
  if (modes.length === 1 && weightDatasets[0]) {
    badge.textContent = `PR: ${weightDatasets[0]._maxW} ${unit}`;
  } else {
    const ov = machineData.length ? Math.max(...machineData.map(r => r.weight)) : 0;
    badge.textContent = `Overall PR: ${ov} kg`;
  }
}

function updateLegend(modes) {
  const html = modes.length > 1 ? modes.map((mode, i) => {
    const color = MODE_COLORS[i % MODE_COLORS.length];
    return `<div class="legend-item"><span class="legend-dot" style="background:${color.line}"></span>${modeLabel(mode)}</div>`;
  }).join('') : '';
  const wl = document.getElementById('weight-legend'); if (wl) wl.innerHTML = html;
  const vl = document.getElementById('volume-legend'); if (vl) vl.innerHTML = html;
}

function renderCharts(labels, weightDatasets, volumeDatasets, unit) {
  const wTitle = document.getElementById('weight-title'); if (wTitle) wTitle.textContent = unit === 'reps' ? 'Reps over time' : 'Weight over time';
  const vBadge = document.getElementById('volume-badge'); if (vBadge) vBadge.textContent = unit === 'reps' ? 'total reps per session' : 'reps × kg per session';
  const baseOpts = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { backgroundColor:'#fff', borderColor:'rgba(74,111,165,0.2)', borderWidth:1, titleColor:'#8A95A8', bodyColor:'#1E2D4A', padding:10 } },
    scales: {
      x: { ticks: { color:'#8A95A8', font:{size:10}, maxRotation:45 }, grid: { color:'rgba(74,111,165,0.06)' } },
      y: { ticks: { color:'#8A95A8', font:{size:10} }, grid: { color:'rgba(74,111,165,0.06)' } }
    }
  };
  const wCtx = document.getElementById('weightChart');
  if (wCtx) {
    if (weightChart) weightChart.destroy();
    weightChart = new Chart(wCtx, { type:'line', data:{ labels, datasets:weightDatasets }, options:{ ...baseOpts, plugins:{...baseOpts.plugins, tooltip:{...baseOpts.plugins.tooltip, callbacks:{label: ctx=>`${ctx.dataset.label}: ${ctx.parsed.y} ${unit}`}}}, scales:{...baseOpts.scales, y:{...baseOpts.scales.y, ticks:{...baseOpts.scales.y.ticks, callback:v=>v+' '+unit}}} } });
  }
  const vCtx = document.getElementById('volumeChart');
  if (vCtx) {
    if (volumeChart) volumeChart.destroy();
    volumeChart = new Chart(vCtx, { type:'bar', data:{ labels, datasets:volumeDatasets }, options:{ ...baseOpts, plugins:{...baseOpts.plugins, tooltip:{...baseOpts.plugins.tooltip, callbacks:{label: ctx=>`${ctx.dataset.label}: ${Math.round(ctx.parsed.y)}`}}}, scales:{...baseOpts.scales, y:{...baseOpts.scales.y, ticks:{...baseOpts.scales.y.ticks, callback:v=>Math.round(v)}}} } });
  }
}

function updateCharts() {
  const machine = document.getElementById('machine-select')?.value;
  const selectedMode = document.getElementById('mode-select')?.value;
  if (!machine) return;

  const machineData = allData.filter(r => r.machine === machine);
  const rangeData = filterByRange(machineData, selectedRange);
  const modes = selectedMode ? [selectedMode] : [];

  const allDates = [...new Set(rangeData.map(r => r.date))].sort();
  const labels = allDates.map(d => formatDateShort(d));

  const unit = chartUnit(rangeData.filter(r => modes.some(m => modeFilter(m)(r))));
  const weightDatasets = buildWeightDatasets(modes, rangeData, allDates, unit);
  const volumeDatasets = buildVolumeDatasets(modes, rangeData, allDates, unit);

  updatePRBadge(modes, weightDatasets, machineData, unit);
  updateLegend(modes);
  renderCharts(labels, weightDatasets, volumeDatasets, unit);
}

function buildPRs(data) {
  const bests = computePRs(data);
  const available = [...new Set(data.map(r => r.machine))];
  const namedModes = [...new Set(data.map(r => r.mode))].filter(Boolean).sort();
  const modes = data.some(r => !r.mode) ? namedModes.concat(['__other__']) : namedModes;
  const lower = m => m.toLowerCase();

  const headerCells = modes.map(m => `<th>${modeLabel(m)}</th>`).join('');

  function machineRows(machines) {
    return machines
      .filter(m => available.some(a => lower(a) === lower(m)))
      .map(m => available.find(a => lower(a) === lower(m)))
      .map(machine => {
        const cells = modes.map(mode => {
          const key = mode === '__other__' ? `${machine}|` : `${machine}|${mode}`;
          const pr = bests[key];
          if (!pr) return `<td><span class="pr-empty">—</span></td>`;
          return `<td><div class="pr-weight">${formatLoad(pr)}</div><div class="pr-date ${dateClass(pr.date)}">${formatDateShort(pr.date)}</div></td>`;
        }).join('');
        return `<tr><td>${machine}</td>${cells}</tr>`;
      }).join('');
  }

  function categorySection(cat) {
    const rows = machineRows(cat.machines);
    if (!rows) return '';
    return `
      <div class="section">
        <div class="section-header">
          <span class="section-title">${cat.label}</span>
          <span class="section-badge">per mode</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="pr-table">
            <thead><tr><th>Machine</th>${headerCells}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  const knownMachines = MACHINE_CATEGORIES.flatMap(c => c.machines).map(lower);
  const otherMachines = available.filter(a => !knownMachines.includes(lower(a))).sort();
  const otherRows = otherMachines.map(machine => {
    const cells = modes.map(mode => {
      const key = mode === '__other__' ? `${machine}|` : `${machine}|${mode}`;
      const pr = bests[key];
      if (!pr) return `<td><span class="pr-empty">—</span></td>`;
      return `<td><div class="pr-weight">${formatLoad(pr)}</div><div class="pr-date ${dateClass(pr.date)}">${formatDateShort(pr.date)}</div></td>`;
    }).join('');
    return `<tr><td>${machine}</td>${cells}</tr>`;
  }).join('');
  const otherSection = otherRows ? `
      <div class="section">
        <div class="section-header">
          <span class="section-title">Other</span>
          <span class="section-badge">per mode</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="pr-table">
            <thead><tr><th>Machine</th>${headerCells}</tr></thead>
            <tbody>${otherRows}</tbody>
          </table>
        </div>
      </div>` : '';

  return `
  <div class="page fade-in" id="page-prs">
    <div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;padding:0 2px;">
      <div style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--fresh);display:inline-block"></span>&lt; 2 weeks</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--aging);display:inline-block"></span>2–4 weeks</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--plateau);display:inline-block"></span>&gt; 4 weeks</div>
    </div>
    ${MACHINE_CATEGORIES.map(categorySection).join('')}
    ${otherSection}
  </div>`;
}

// Manual logging for exercises the eGym armband doesn't capture. Saves go to the
// Apps Script web app in apps-script/manual-log.gs, which appends rows to the sheet.
const LOG_URL = 'https://script.google.com/macros/s/AKfycbyY-ApN-dtCe6cZCaMi0TskbTgBGZv_ruJ8VevWFbJC0L0jxQFsMKGfLX_2rL6U-VkZ/exec'; // paste the Apps Script web app URL (…/exec) here
const MANUAL_EXERCISES = ['Romanian Deadlift', 'Single Leg Hip Thrust', 'Cable Face Pull', 'Cable Triceps Pressdown'];
const PASSCODE_KEY = 'logPasscode';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function todayISO() {
  const d = new Date();
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function readPasscode() {
  try { return localStorage.getItem(PASSCODE_KEY) || ''; } catch { return ''; }
}

function manualExercises(data) {
  const logged = data.filter(r => r.file === 'manual').map(r => r.machine);
  return [...new Set([...MANUAL_EXERCISES, ...logged])];
}

function buildLog(data) {
  const options = manualExercises(data).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
  return `
  <div class="page fade-in" id="page-log">
    <div class="section">
      <div class="section-header">
        <span class="section-title">Log a workout</span>
        <span class="section-badge">free weights & cables</span>
      </div>
      <label class="log-label" for="log-exercise">Exercise</label>
      <select class="styled-select" id="log-exercise" onchange="onLogExerciseChange()">
        ${options}
        <option value="__new__">Other…</option>
      </select>
      <input class="log-input" id="log-new-exercise" placeholder="Exercise name" style="display:none;margin-top:8px;">
      <label class="log-label" for="log-date">Date</label>
      <input class="log-input" type="date" id="log-date" value="${todayISO()}">
      <label class="log-label">Sets</label>
      <div class="set-row set-row-head"><span></span><span>Reps</span><span>kg</span><span></span></div>
      <div id="log-sets"></div>
      <div class="log-hint" id="log-prefill-hint"></div>
      <button class="btn btn-ghost" onclick="addLogSet()">+ Add set</button>
      <label class="log-label" for="log-passcode">Passcode</label>
      <input class="log-input" type="password" id="log-passcode" value="${esc(readPasscode())}" autocomplete="current-password">
      <button class="btn btn-primary" id="log-save" onclick="saveLog()">Save</button>
      <div class="log-status" id="log-status"></div>
    </div>
  </div>`;
}

function setRowHTML(i, reps = '', weight = '') {
  return `
    <div class="set-row">
      <span class="set-num">Set ${i + 1}</span>
      <input class="log-input" type="number" inputmode="numeric" min="1" placeholder="12" value="${reps}">
      <input class="log-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="BW" value="${weight}">
      <button class="set-remove" onclick="removeLogSet(this)" aria-label="Remove set">×</button>
    </div>`;
}

function renumberLogSets() {
  document.querySelectorAll('#log-sets .set-num').forEach((el, i) => el.textContent = `Set ${i + 1}`);
}

function addLogSet() {
  const rows = document.querySelectorAll('#log-sets .set-row');
  const last = rows[rows.length - 1]?.querySelectorAll('input');
  document.getElementById('log-sets').insertAdjacentHTML('beforeend',
    setRowHTML(rows.length, last?.[0].value || '', last?.[1].value || ''));
}

function removeLogSet(btn) {
  btn.closest('.set-row').remove();
  renumberLogSets();
}

// Prefill with the most recent session of this exercise so you only edit what changed.
function onLogExerciseChange() {
  const exercise = document.getElementById('log-exercise').value;
  document.getElementById('log-new-exercise').style.display = exercise === '__new__' ? 'block' : 'none';
  const rows = allData.filter(r => r.machine === exercise);
  const lastDate = rows.map(r => r.date).sort().pop();
  const lastSets = rows.filter(r => r.date === lastDate).sort((a, b) => a.setNum - b.setNum);
  const sets = lastSets.length ? lastSets.map(r => [r.reps, r.weight || '']) : [['', ''], ['', ''], ['', '']];
  document.getElementById('log-sets').innerHTML = sets.map(([reps, kg], i) => setRowHTML(i, reps, kg)).join('');
  document.getElementById('log-prefill-hint').textContent = lastDate ? `Prefilled from ${formatDateShort(lastDate)}` : '';
}

function setLogStatus(text, kind) {
  const el = document.getElementById('log-status');
  if (el) { el.textContent = text; el.className = `log-status ${kind || ''}`; }
}

async function saveLog() {
  const picked = document.getElementById('log-exercise').value;
  const exercise = (picked === '__new__' ? document.getElementById('log-new-exercise').value : picked).trim();
  const date = document.getElementById('log-date').value;
  const token = document.getElementById('log-passcode').value;
  const sets = [...document.querySelectorAll('#log-sets .set-row')].map(row => {
    const [reps, kg] = row.querySelectorAll('input');
    return { reps: parseInt(reps.value) || 0, weight: parseFloat(kg.value) || 0 };
  }).filter(s => s.reps > 0);

  if (!LOG_URL) return setLogStatus('Logging isn\'t connected yet — LOG_URL is empty.', 'err');
  if (!exercise) return setLogStatus('Pick or type an exercise.', 'err');
  if (!date) return setLogStatus('Pick a date.', 'err');
  if (!sets.length) return setLogStatus('Enter reps for at least one set.', 'err');
  if (!token) return setLogStatus('Enter your passcode.', 'err');

  const btn = document.getElementById('log-save');
  btn.disabled = true;
  setLogStatus('Saving…');
  try {
    // No Content-Type header: keeps this a "simple" request so Apps Script needs no CORS preflight.
    const res = await fetch(LOG_URL, { method: 'POST', body: JSON.stringify({ token, date, exercise, sets }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Save failed');
    try { localStorage.setItem(PASSCODE_KEY, token); } catch {}
    await refresh('log');
    setLogStatus(`Saved ${sets.length} set${sets.length > 1 ? 's' : ''} of ${exercise}.`, 'ok');
  } catch (e) {
    btn.disabled = false;
    setLogStatus(e.message, 'err');
  }
}

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach((el,i) => {
    el.classList.toggle('active', ['overview','streak','progress','prs','log'][i] === page);
  });
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(`page-${page}`);
  if (target) {
    target.classList.add('active');
    if (page === 'progress') setTimeout(onMachineChange, 50);
  }
}

async function refresh(page) {
  const rows = await fetchData();
  allData = parseRows(rows);
  const dates = getUniqueDates(allData);
  const lastDate = dates[dates.length-1] || '';
  document.getElementById('last-sync').textContent = `Last session: ${formatDate(lastDate)}`;
  document.getElementById('app').innerHTML = `<main>${buildOverview(allData)}${buildProgress(allData)}${buildPRs(allData)}${buildStreak(allData)}${buildLog(allData)}</main>`;
  onLogExerciseChange();
  showPage(page);
}

async function init() {
  try {
    await refresh('overview');
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="loading">
        <span style="font-size:22px;color:var(--plateau);">⚠</span>
        <span style="font-size:13px;color:var(--text);font-weight:500;">Could not load data</span>
        <span style="font-size:12px;color:var(--muted);text-align:center;max-width:280px;">${e.message}</span>
      </div>`;
  }
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
